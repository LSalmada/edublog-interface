# fly.toml — Edublog Interface (front-end SPA servido por Nginx)
#
# Para criar o app pela primeira vez:
#   fly apps create edublog-interface
# Para fazer deploy manual:
#   fly deploy
# A imagem é construída a partir do Dockerfile da raiz.

app = "edublog-interface"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  # Envs VITE_* são consumidas em build-time pelo Vite.
  [build.args]
    VITE_API_BASE_URL = "https://edublog-api.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
